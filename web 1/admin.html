<!doctype html>
<html lang="en"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1">
<meta name="robots" content="noindex"><title>Submissions – Admin</title>
<style>body{font:15px system-ui;max-width:900px;margin:30px auto;padding:0 16px;color:#222}input,button{font:inherit;padding:8px 12px}
button{background:#2c6e4a;color:#fff;border:0;border-radius:6px;cursor:pointer}.card{border:1px solid #ddd;border-radius:10px;padding:14px;margin:12px 0}
small{color:#777}p{margin:6px 0;white-space:pre-wrap}</style></head>
<body><h1>Form submissions</h1>
<form id="f"><input id="t" type="password" placeholder="Admin token" required> <button>Load</button></form>
<p id="s"></p><div id="list"></div>
<script>
document.getElementById('f').onsubmit = async e => {
  e.preventDefault();
  const s = document.getElementById('s'), list = document.getElementById('list'); list.textContent = '';
  const r = await fetch('/api/submissions', { headers: { 'X-Admin-Token': document.getElementById('t').value } });
  if (!r.ok) { s.textContent = r.status === 403 ? 'Admin is disabled: start the server with ADMIN_TOKEN set.' : 'Wrong token.'; return; }
  const rows = await r.json(); s.textContent = rows.length + ' submission(s)';
  rows.forEach(x => {
    const c = document.createElement('div'); c.className = 'card';
    const h = document.createElement('b'); h.textContent = `${x.name} – ${x.service || x.type}`;
    const m = document.createElement('small'); m.textContent = ` ${new Date(x.at).toLocaleString()} · ${x.type} · ${x.page}`;
    const a = document.createElement('p'); a.textContent = `${x.email}  ${x.phone}`;
    const b = document.createElement('p'); b.textContent = x.message;
    c.append(h, m, a, b); list.append(c);
  });
};
</script></body></html>
