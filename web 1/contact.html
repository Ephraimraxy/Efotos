<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Contact Us – Talento</title>
<meta name="description" content="Get in touch with Talento to discuss your hiring needs.">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Archivo:wght@500;600;700;800&family=Inter:wght@400;500;600&display=swap" rel="stylesheet">
<link rel="stylesheet" href="styles.css">
</head>
<body>
<div id="site-header"></div>
<main>
<section class="hero img-slot" data-media="hero-contact">
  <div class="container hero-inner">
    <p class="crumbs"><a href="index.html">Home</a><i class="chev"></i><span>Contact Us</span></p>
    <h1>Let’s Talk About<br>Your Next Hire</h1>
  </div>
</section>

<section class="section tight">
  <div class="container" data-tabs>
    <div class="tabs-nav" role="tablist"><button role="tab" data-tab="message" aria-selected="false">Send A Message</button><button role="tab" data-tab="office" aria-selected="false">Visit Us</button></div>

    <div data-panel id="message">
      <div class="contact-grid">
        <div class="contact-form">
          <p class="eyebrow">Get In Touch</p>
          <h2>Send Us A Message</h2>
          <div data-form-slot="contact"></div>
        </div>
        <aside class="info">
          <div class="info-card reveal"><span class="ico" data-icon="phone"></span><div><h3>Phone</h3><p><a data-site-href="phone:tel:" data-site="phone"></a></p></div></div>
          <div class="info-card reveal"><span class="ico" data-icon="mail"></span><div><h3>Email</h3><p><a data-site-href="email:mailto:" data-site="email"></a></p></div></div>
          <div class="info-card reveal"><span class="ico" data-icon="clock"></span><div><h3>Days Open</h3><p data-site="hours"></p></div></div>
        </aside>
      </div>
    </div>

    <div data-panel id="office">
      <div class="contact-grid">
        <iframe class="map" title="Map of our head office" loading="lazy" referrerpolicy="no-referrer-when-downgrade"
          src="https://www.openstreetmap.org/export/embed.html?bbox=111.49%2C-7.66%2C111.56%2C-7.60&amp;layer=mapnik&amp;marker=-7.6298%2C111.5239"></iframe>
        <aside class="info">
          <div class="info-card reveal"><span class="ico" data-icon="pin"></span><div><h3>Head Office</h3><p data-site="address"></p></div></div>
          <div class="info-card reveal"><span class="ico" data-icon="clock"></span><div><h3>Days Open</h3><p data-site="hours"></p></div></div>
          <a href="#message" class="btn btn-orange">Send A Message <span aria-hidden="true">→</span></a>
        </aside>
      </div>
    </div>
  </div>
</section>
</main>
<div id="site-footer"></div>
<script src="config.js"></script>
<script src="site.js"></script>
</body>
</html>
